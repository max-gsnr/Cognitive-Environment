<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>orbit.db — Live Telemetry Inspector</title>
    <style>
      :root {
        --bg: #0b0f19;
        --panel: #131b2e;
        --line: #222f4c;
        --text: #f1f5f9;
        --dim: #94a3b8;
        --ok: #4ade80;
        --bad: #f87171;
        --flash: #1e3a8a;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 16px 20px 40px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .header-left { display: flex; align-items: center; gap: 12px; }
      h1 { font-size: 20px; margin: 0; letter-spacing: 0.2px; font-weight: 700; color: #ffffff; }
      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .live-pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 8px #4ade80;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      .header-right { display: flex; align-items: center; gap: 10px; }
      .clock { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; }
      .reset-btn {
        background: #ef4444;
        color: #ffffff;
        border: 1px solid #dc2626;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .reset-btn:hover {
        background: #dc2626;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
      }
      .profile-filters {
        display: flex;
        gap: 6px;
        margin: 10px 0 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filter-label { color: var(--dim); font-size: 12px; text-transform: uppercase; font-weight: 600; margin-right: 4px; }
      .filter-btn {
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.1s ease;
      }
      .filter-btn:hover { background: #334155; color: #f8fafc; }
      .filter-btn.active { background: #2563eb; color: #ffffff; border-color: #3b82f6; font-weight: 600; }
      .counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
      .count {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        min-width: 90px;
      }
      .count b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; color: #f8fafc; }
      .count span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 16px 6px;
        margin-bottom: 14px;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        margin: 0 0 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h2 em { color: var(--dim); font-style: normal; text-transform: none; letter-spacing: 0; font-size: 12px; }
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--dim);
        font-weight: 600;
        padding: 0 10px 6px 0;
        white-space: nowrap;
      }
      td {
        padding: 6px 10px 6px 0;
        border-top: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
        vertical-align: top;
      }
      tr.flash td { background: var(--flash); }
      td.nowrap { white-space: nowrap; }
      td.mono, .vec { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .sum { font-size: 15px; font-weight: 600; white-space: nowrap; color: #facc15; }
      .ok { color: var(--ok); font-weight: 600; }
      .bad { color: var(--bad); font-weight: 600; }
      .pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 11px;
        color: var(--dim);
        background: #1e293b;
      }
      .vecrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .chip {
        border-radius: 6px;
        padding: 2px 7px;
        font-size: 12px;
        background: #1f293d;
        border: 1px solid var(--line);
      }
      .chip.on { color: var(--accent); border-color: #2563eb; font-weight: 600; }
      .chip.changed { background: #1e3a8a; border-color: #3b82f6; }
      .note { color: var(--text); }
      .dim { color: var(--dim); }
      .empty { color: var(--dim); padding: 6px 0 12px; font-style: italic; }
      .counts.tight { gap: 6px; }
      .counts.tight .count { min-width: 0; flex: 1 1 0; padding: 7px 8px; }
      .gauge b { font-size: 16px; }
      .gauge span { font-size: 10px; letter-spacing: 0.3px; }
      .good { color: var(--ok); }
      .warn { color: #fbbf24; }
      .poor { color: var(--bad); }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: #1e293b;
        margin-top: 4px;
        overflow: hidden;
      }
      .bar span { display: block; height: 100%; background: currentColor; }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>orbit.db</h1>
        <div class="live-badge"><span class="live-pulse"></span> LIVE SYNC (300ms)</div>
      </div>
      <div class="header-right">
        <span class="clock" id="clock"></span>
        <button type="button" class="reset-btn" id="reset-btn" onclick="clearHistory()" title="Clear previous demo attempts and start fresh">
          🗑️ Clear Demo History
        </button>
      </div>
    </header>

    <div class="profile-filters" id="profile-filters">
      <span class="filter-label">Filter Child:</span>
      <button class="filter-btn active" onclick="setFilter(null)">All Students</button>
    </div>

    <div class="counts" id="counts"></div>
    <div class="counts tight" id="latest"></div>

    <section>
      <h2>subject_mastery <em>— what Loop A decided</em></h2>
      <div id="mastery"></div>
    </section>

    <section>
      <h2>attempts <em>— newest first: answer, classification, adaptation</em></h2>
      <div id="attempts"></div>
    </section>

    <section>
      <h2>attempts <em>— motor &amp; attention biometrics on the same rows</em></h2>
      <div id="bio"></div>
    </section>

    <section>
      <h2>development_notes &amp; reported_problems</h2>
      <div id="side"></div>
    </section>

    <section>
      <h2>audit_log</h2>
      <div id="audit"></div>
    </section>

    <script>
      const AXES = ["digits", "magnitude", "carries", "borrows", "zero_in_minuend"];
      const seen = new Set();
      const prevVectors = new Map();
      let first = true;
      let selectedProfileId = null;

      function setFilter(profileId) {
        selectedProfileId = profileId;
        const btns = document.querySelectorAll(".profile-filters .filter-btn");
        btns.forEach((b) => b.classList.remove("active"));
        if (!profileId) {
          btns[0]?.classList.add("active");
        } else {
          document.getElementById(`filter-${profileId}`)?.classList.add("active");
        }
        tick();
      }

      async function clearHistory() {
        if (!confirm("Clear all previous attempts and logs in orbit.db? This resets the demo session to a clean slate.")) return;
        try {
          await fetch("/clear-history", { method: "POST" });
          seen.clear();
          first = true;
          tick();
        } catch (e) {
          alert("Error clearing history: " + e.message);
        }
      }

      function shortTier(key) {
        if (!key) return "—";
        const parts = Object.fromEntries(String(key).split("|").map((p) => p.split("=")));
        const flags = ["carries", "borrows", "zero_in_minuend"]
          .filter((flag) => parts[flag] === "True")
          .map((flag) => ({ carries: "carry", borrows: "borrow", zero_in_minuend: "zero" })[flag]);
        const magnitude = String(parts.magnitude || "single").replace("_double", "·2").replace("_triple", "·3");
        return [`${parts.digits || 1}d`, magnitude, ...flags].join(" ");
      }

      const esc = (v) => String(v ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      const time = (s) => (s ? String(s).slice(11, 19) : "");

      function vectorChips(vector, previous) {
        return AXES.map((axis) => {
          const value = vector[axis];
          if (value === undefined) return "";
          const changed = previous && previous[axis] !== value;
          const on = value === true || (axis === "digits" && value > 1);
          const shown = value === true ? axis : value === false ? `no ${axis}` : `${axis} ${value}`;
          return `<span class="chip ${on ? "on" : ""} ${changed ? "changed" : ""}">${esc(shown)}</span>`;
        }).join("");
      }

      function renderProfiles(profiles) {
        const container = document.getElementById("profile-filters");
        const existingHtml = `<span class="filter-label">Filter Child:</span>
          <button class="filter-btn ${selectedProfileId === null ? "active" : ""}" onclick="setFilter(null)">All Students</button>`;
        const buttons = (profiles || []).map(
          (p) => `<button id="filter-${p.id}" class="filter-btn ${selectedProfileId === p.id ? "active" : ""}" onclick="setFilter('${p.id}')">${esc(p.name)}</button>`
        ).join("");
        container.innerHTML = existingHtml + buttons;
      }

      function renderMastery(rows) {
        if (!rows.length) {
          document.getElementById("mastery").innerHTML = '<div class="empty">no subject mastery initialized</div>';
          return;
        }
        document.getElementById("mastery").innerHTML = rows
          .map((row) => {
            const vector = JSON.parse(row.difficulty_vector);
            const key = `${row.child_name || ""}-${row.skill_id}`;
            const chips = vectorChips(vector, prevVectors.get(key));
            prevVectors.set(key, vector);
            return `<div class="vecrow" style="margin:0 0 10px">
                <span class="pill" style="color:#f8fafc;font-weight:600">${esc(row.child_name || "Child")}</span>
                <span class="pill">${esc(row.skill_id)}</span>${chips}
                <span class="dim">updated ${time(row.updated_at)}</span>
              </div>`;
          })
          .join("");
      }

      function renderAttempts(rows) {
        if (!rows.length) {
          document.getElementById("attempts").innerHTML = '<div class="empty">no attempts recorded in orbit.db yet — answer a question in the game!</div>';
          return;
        }
        const body = rows
          .map((row) => {
            let operands = [0, 0];
            try { operands = JSON.parse(row.operands); } catch (_) {}
            const fresh = !first && !seen.has(row.id);
            seen.add(row.id);
            const correct = Boolean(row.is_correct);
            return `<tr class="${fresh ? "flash" : ""}">
              <td class="nowrap"><span class="pill">${esc(row.child_name || "Student")}</span></td>
              <td class="sum">${operands[0]} ${esc(row.operator)} ${operands[1]} = ${esc(row.answer_given)}</td>
              <td class="nowrap ${correct ? "ok" : "bad"}">${correct ? "✓ correct" : `✗ wrong · ans=${esc(row.correct_answer)}`}</td>
              <td class="mono">${esc(row.error_class || "steady")}</td>
              <td class="mono dim nowrap">${esc(shortTier(row.tier_key))}</td>
              <td class="dim">${((row.latency_to_submit_ms || 0) / 1000).toFixed(1)}s</td>
              <td class="dim">${time(row.created_at)}</td>
            </tr>`;
          })
          .join("");
        document.getElementById("attempts").innerHTML = `<table>
            <tr><th>student</th><th>answered</th><th>result</th><th>error_class</th><th>tier</th><th>latency</th><th>at</th></tr>
            ${body}
          </table>`;
      }

      function renderRows(target, rows, columns, emptyText, seenPrefix = target) {
        if (!rows || !rows.length) {
          document.getElementById(target).innerHTML = `<div class="empty">${emptyText}</div>`;
          return;
        }
        const head = columns.map((column) => `<th>${column.label}</th>`).join("");
        const body = rows
          .map((row) => {
            const fresh = !first && !seen.has(seenPrefix + row.id);
            seen.add(seenPrefix + row.id);
            const cells = columns.map((column) => `<td class="${column.cls || ""}">${esc(column.get(row))}</td>`).join("");
            return `<tr class="${fresh ? "flash" : ""}">${cells}</tr>`;
          })
          .join("");
        document.getElementById(target).innerHTML = `<table><tr>${head}</tr>${body}</table>`;
      }

      const num = (v, digits = 2) => (v === null || v === undefined ? null : Number(v).toFixed(digits));

      function renderLatest(rows) {
        const row = rows[0];
        if (!row) {
          document.getElementById("latest").innerHTML =
            '<div class="empty">no live biometrics stream yet — play a question to stream real-time motor analytics</div>';
          return;
        }
        const focus = row.focus_score;
        const focusClass = focus === null ? "dim" : focus >= 80 ? "good" : focus >= 60 ? "warn" : "poor";
        const jitterClass =
          row.jitter_ratio === null ? "dim" : row.jitter_ratio > 2.5 ? "poor" : "good";
        const cards = [
          {
            label: `focus (${row.child_name || "Child"})`,
            value: focus === null ? "—" : `${num(focus)}%`,
            cls: focusClass,
            bar: focus,
          },
          {
            label: "cursor velocity",
            value: row.cursor_velocity_px_s !== null ? `${num(row.cursor_velocity_px_s)} px/s` : "—",
          },
          {
            label: "jitter ratio",
            value: row.jitter_ratio === null ? "—" : `${num(row.jitter_ratio)}×`,
            cls: jitterClass,
          },
          { label: "idle latency", value: row.idle_time_ms !== null ? `${row.idle_time_ms} ms` : "—" },
          { label: "distractions", value: row.distraction_events ?? "0" },
        ];
        document.getElementById("latest").innerHTML = cards
          .map(
            (card) => `<div class="count gauge ${card.cls || ""}">
              <b>${card.value}</b><span>${card.label}</span>
              ${card.bar !== undefined && card.bar !== null ? `<div class="bar"><span style="width:${Math.min(100, card.bar)}%"></span></div>` : ""}
            </div>`
          )
          .join("");
      }

      function renderBio(rows) {
        renderRows(
          "bio",
          rows,
          [
            { label: "student", get: (row) => row.child_name || "Student", cls: "nowrap" },
            {
              label: "answered",
              get: (row) => {
                let operands = [0, 0];
                try { operands = JSON.parse(row.operands); } catch (_) {}
                return `${operands[0]} ${row.operator} ${operands[1]}`;
              },
              cls: "nowrap",
            },
            {
              label: "focus_score",
              get: (row) => (row.focus_score === null ? "—" : `${num(row.focus_score)}%`),
              cls: "nowrap",
            },
            {
              label: "cursor_velocity",
              get: (row) => (row.cursor_velocity_px_s === null ? "—" : `${num(row.cursor_velocity_px_s)} px/s`),
              cls: "mono nowrap",
            },
            {
              label: "jitter_ratio",
              get: (row) => (row.jitter_ratio === null ? "—" : `${num(row.jitter_ratio)}×`),
              cls: "mono nowrap",
            },
            { label: "idle_time_ms", get: (row) => (row.idle_time_ms !== null ? `${row.idle_time_ms} ms` : "—"), cls: "mono nowrap" },
            {
              label: "distractions",
              get: (row) => (row.distraction_events !== null ? String(row.distraction_events) : "0"),
              cls: "mono nowrap",
            },
          ],
          "no attempts yet",
          "bio"
        );
      }

      let profileRendered = false;

      async function tick() {
        try {
          const url = selectedProfileId ? `/data?profile_id=${encodeURIComponent(selectedProfileId)}` : "/data";
          const data = await fetch(url).then((response) => response.json());
          document.getElementById("clock").textContent = new Date().toLocaleTimeString();
          
          if (!profileRendered && data.profiles) {
            renderProfiles(data.profiles);
            profileRendered = true;
          }

          document.getElementById("counts").innerHTML = Object.entries(data.counts || {})
            .map(([name, value]) => `<div class="count"><b>${value}</b><span>${name}</span></div>`)
            .join("");
          
          renderMastery(data.mastery || []);
          renderLatest(data.attempts || []);
          renderAttempts(data.attempts || []);
          renderBio(data.attempts || []);

          const notes = (data.notes || []).map((row) => ({ ...row, kind: `${row.child_name || "Child"} · ${row.author}`, text: row.note }));
          const problems = (data.problems || []).map((row) => ({ ...row, kind: "problem · child", text: row.description }));
          renderRows(
            "side",
            [...notes, ...problems],
            [
              { label: "row", get: (row) => row.kind, cls: "dim" },
              { label: "text", get: (row) => row.text, cls: "note" },
              { label: "at", get: (row) => time(row.created_at), cls: "dim" },
            ],
            "no notes or reported problems yet"
          );

          renderRows(
            "audit",
            data.audit || [],
            [
              { label: "actor", get: (row) => row.actor, cls: "dim" },
              { label: "action", get: (row) => row.action, cls: "mono" },
              { label: "payload", get: (row) => row.payload, cls: "mono dim" },
              { label: "at", get: (row) => time(row.created_at), cls: "dim" },
            ],
            "nothing logged yet"
          );
          first = false;
        } catch (err) {
          console.error("Poll error", err);
        }
      }

      tick();
      setInterval(tick, 300);
    </script>
  </body>
</html>
