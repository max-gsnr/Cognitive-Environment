<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>orbit.db — live</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #171a23;
        --line: #262b38;
        --text: #e7eaf0;
        --dim: #8b93a7;
        --ok: #4ade80;
        --bad: #fb7185;
        --flash: #2b3a55;
        --accent: #7dd3fc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 18px 20px 40px;
      }
      header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
      h1 { font-size: 21px; margin: 0; letter-spacing: 0.2px; }
      .clock { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 14px; }
      .counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
      .count {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        min-width: 96px;
      }
      .count b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
      .count span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px 6px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        margin: 0 0 10px;
      }
      h2 em { color: var(--dim); font-style: normal; text-transform: none; letter-spacing: 0; }
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--dim);
        font-weight: 600;
        padding: 0 10px 6px 0;
        white-space: nowrap;
      }
      td {
        padding: 7px 10px 7px 0;
        border-top: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
        vertical-align: top;
      }
      tr.flash td { background: var(--flash); }
      td.nowrap { white-space: nowrap; }
      td.mono, .vec { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      .sum { font-size: 17px; font-weight: 600; white-space: nowrap; }
      .ok { color: var(--ok); font-weight: 600; }
      .bad { color: var(--bad); font-weight: 600; }
      .pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 9px;
        font-size: 12px;
        color: var(--dim);
      }
      .vecrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .chip {
        border-radius: 8px;
        padding: 3px 9px;
        font-size: 13px;
        background: #1f2431;
        border: 1px solid var(--line);
      }
      .chip.on { color: var(--accent); border-color: #2f4b60; }
      .chip.changed { background: var(--flash); border-color: #47607f; }
      .note { color: var(--text); }
      .dim { color: var(--dim); }
      .empty { color: var(--dim); padding: 4px 0 10px; }
      .counts.tight { gap: 6px; }
      .counts.tight .count { min-width: 0; flex: 1 1 0; padding: 8px 9px; }
      .gauge b { font-size: 18px; }
      .gauge span { font-size: 11px; letter-spacing: 0.3px; }
      .good { color: var(--ok); }
      .warn { color: #fbbf24; }
      .poor { color: var(--bad); }
      .bar {
        height: 5px;
        border-radius: 3px;
        background: #232838;
        margin-top: 6px;
        overflow: hidden;
      }
      .bar span { display: block; height: 100%; background: currentColor; }
    </style>
  </head>
  <body>
    <header>
      <h1>orbit.db <span class="dim">— live</span></h1>
      <span class="clock" id="clock"></span>
    </header>
    <div class="counts" id="counts"></div>
    <div class="counts tight" id="latest"></div>
    <section>
      <h2>subject_mastery <em>— what Loop A decided</em></h2>
      <div id="mastery"></div>
    </section>
    <section>
      <h2>attempts <em>— newest first: answer, classification, adaptation</em></h2>
      <div id="attempts"></div>
    </section>
    <section>
      <h2>attempts <em>— motor &amp; attention columns on the same rows</em></h2>
      <div id="bio"></div>
    </section>
    <section>
      <h2>development_notes &amp; reported_problems</h2>
      <div id="side"></div>
    </section>
    <section>
      <h2>audit_log</h2>
      <div id="audit"></div>
    </section>

    <script>
      const AXES = ["digits", "magnitude", "carries", "borrows", "zero_in_minuend"];
      const seen = new Set();
      const prevVectors = new Map();
      let first = true;

      function shortTier(key) {
        const parts = Object.fromEntries(String(key).split("|").map((p) => p.split("=")));
        const flags = ["carries", "borrows", "zero_in_minuend"]
          .filter((flag) => parts[flag] === "True")
          .map((flag) => ({ carries: "carry", borrows: "borrow", zero_in_minuend: "zero" })[flag]);
        const magnitude = String(parts.magnitude).replace("_double", "·2").replace("_triple", "·3");
        return [`${parts.digits}d`, magnitude, ...flags].join(" ");
      }

      const esc = (v) => String(v ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      const time = (s) => (s ? String(s).slice(11, 19) : "");

      function vectorChips(vector, previous) {
        return AXES.map((axis) => {
          const value = vector[axis];
          if (value === undefined) return "";
          const changed = previous && previous[axis] !== value;
          const on = value === true || (axis === "digits" && value > 1);
          const shown = value === true ? axis : value === false ? `no ${axis}` : `${axis} ${value}`;
          return `<span class="chip ${on ? "on" : ""} ${changed ? "changed" : ""}">${esc(shown)}</span>`;
        }).join("");
      }

      function renderMastery(rows) {
        document.getElementById("mastery").innerHTML = rows
          .map((row) => {
            const vector = JSON.parse(row.difficulty_vector);
            const key = row.skill_id;
            const chips = vectorChips(vector, prevVectors.get(key));
            prevVectors.set(key, vector);
            return `<div class="vecrow" style="margin:0 0 12px">
                <span class="pill">${esc(row.skill_id)}</span>${chips}
                <span class="dim">updated ${time(row.updated_at)}</span>
              </div>`;
          })
          .join("");
      }

      function renderAttempts(rows) {
        if (!rows.length) {
          document.getElementById("attempts").innerHTML = '<div class="empty">no attempts yet — answer a question</div>';
          return;
        }
        const body = rows
          .map((row) => {
            const operands = JSON.parse(row.operands);
            const fresh = !first && !seen.has(row.id);
            seen.add(row.id);
            const correct = row.is_correct;
            return `<tr class="${fresh ? "flash" : ""}">
              <td class="sum">${operands[0]} ${esc(row.operator)} ${operands[1]} = ${esc(row.answer_given)}</td>
              <td class="nowrap ${correct ? "ok" : "bad"}">${correct ? "correct" : `wrong · ${esc(row.correct_answer)}`}</td>
              <td class="mono">${esc(row.error_class || "—")}</td>
              <td class="mono dim nowrap">${esc(shortTier(row.tier_key))}</td>
              <td class="dim">${(row.latency_to_submit_ms / 1000).toFixed(1)}s</td>
              <td class="dim">${time(row.created_at)}</td>
            </tr>`;
          })
          .join("");
        document.getElementById("attempts").innerHTML = `<table>
            <tr><th>answered</th><th>result</th><th>error_class</th><th>tier</th><th>latency</th><th>at</th></tr>
            ${body}
          </table>`;
      }

      function renderRows(target, rows, columns, emptyText, seenPrefix = target) {
        if (!rows.length) {
          document.getElementById(target).innerHTML = `<div class="empty">${emptyText}</div>`;
          return;
        }
        const head = columns.map((column) => `<th>${column.label}</th>`).join("");
        const body = rows
          .map((row) => {
            const fresh = !first && !seen.has(seenPrefix + row.id);
            seen.add(seenPrefix + row.id);
            const cells = columns.map((column) => `<td class="${column.cls || ""}">${esc(column.get(row))}</td>`).join("");
            return `<tr class="${fresh ? "flash" : ""}">${cells}</tr>`;
          })
          .join("");
        document.getElementById(target).innerHTML = `<table><tr>${head}</tr>${body}</table>`;
      }

      const num = (v, digits = 2) => (v === null || v === undefined ? null : Number(v).toFixed(digits));

      function renderLatest(rows) {
        const row = rows[0];
        if (!row) {
          document.getElementById("latest").innerHTML =
            '<div class="empty">no biometrics yet — the arcade game reports them on each answer</div>';
          return;
        }
        const focus = row.focus_score;
        const focusClass = focus === null ? "dim" : focus >= 80 ? "good" : focus >= 60 ? "warn" : "poor";
        const jitterClass = row.jitter_ratio > 2.5 ? "poor" : "good";
        const cards = [
          {
            label: "focus_score",
            value: focus === null ? "—" : `${num(focus)}%`,
            cls: focusClass,
            bar: focus,
          },
          {
            label: "px/s velocity",
            value: num(row.cursor_velocity_px_s) ?? "—",
          },
          {
            label: "jitter_ratio",
            value: row.jitter_ratio === null ? "—" : `${num(row.jitter_ratio)}×`,
            cls: jitterClass,
          },
          { label: "idle_time_ms", value: row.idle_time_ms ?? "—" },
          { label: "distractions", value: row.distraction_events ?? "—" },
        ];
        document.getElementById("latest").innerHTML = cards
          .map(
            (card) => `<div class="count gauge ${card.cls || ""}">
              <b>${card.value}</b><span>${card.label}</span>
              ${card.bar !== undefined && card.bar !== null ? `<div class="bar"><span style="width:${Math.min(100, card.bar)}%"></span></div>` : ""}
            </div>`
          )
          .join("");
      }

      function renderBio(rows) {
        renderRows(
          "bio",
          rows,
          [
            {
              label: "answered",
              get: (row) => {
                const operands = JSON.parse(row.operands);
                return `${operands[0]} ${row.operator} ${operands[1]}`;
              },
              cls: "nowrap",
            },
            {
              label: "focus_score",
              get: (row) => (row.focus_score === null ? "—" : `${num(row.focus_score)}%`),
              cls: "nowrap",
            },
            {
              label: "cursor_velocity",
              get: (row) => (row.cursor_velocity_px_s === null ? "—" : `${num(row.cursor_velocity_px_s)} px/s`),
              cls: "mono nowrap",
            },
            {
              label: "jitter_ratio",
              get: (row) => (row.jitter_ratio === null ? "—" : `${num(row.jitter_ratio)}×`),
              cls: "mono nowrap",
            },
            { label: "idle_time_ms", get: (row) => row.idle_time_ms ?? "—", cls: "mono nowrap" },
            {
              label: "distractions",
              get: (row) => row.distraction_events ?? "—",
              cls: "mono nowrap",
            },
          ],
          "no attempts yet",
          "bio"
        );
      }

      async function tick() {
        const data = await fetch("/data").then((response) => response.json());
        document.getElementById("clock").textContent = new Date().toLocaleTimeString();
        document.getElementById("counts").innerHTML = Object.entries(data.counts)
          .map(([name, value]) => `<div class="count"><b>${value}</b><span>${name}</span></div>`)
          .join("");
        renderMastery(data.mastery);
        renderLatest(data.attempts);
        renderAttempts(data.attempts);
        renderBio(data.attempts);
        const notes = data.notes.map((row) => ({ ...row, kind: `note · ${row.author}`, text: row.note }));
        const problems = data.problems.map((row) => ({ ...row, kind: "problem · child", text: row.description }));
        renderRows(
          "side",
          [...notes, ...problems],
          [
            { label: "row", get: (row) => row.kind, cls: "dim" },
            { label: "text", get: (row) => row.text, cls: "note" },
            { label: "at", get: (row) => time(row.created_at), cls: "dim" },
          ],
          "no notes or reported problems yet"
        );
        renderRows(
          "audit",
          data.audit,
          [
            { label: "actor", get: (row) => row.actor, cls: "dim" },
            { label: "action", get: (row) => row.action, cls: "mono" },
            { label: "payload", get: (row) => row.payload, cls: "mono dim" },
            { label: "at", get: (row) => time(row.created_at), cls: "dim" },
          ],
          "nothing logged yet"
        );
        first = false;
      }

      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
