[project]
name = "orbit"
version = "0.1.0"
description = "Orbit: adaptive math games for children with ADHD"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "frontend", "games"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The prompts are stored verbatim; rewrapping them would change what the model sees.
"app/prompts.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is expressed as a call in the default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
