<!DOCTYPE html>
<!--
  Orbit — an instrumented number-line arithmetic game.

  Two things make this file the substrate of an evolutionary search:

  1. ORBIT_CONFIG below is the cheap mutation surface (a coding agent can also
     rewrite anything else in the file — mechanics, rendering, scaffolds).
  2. window.orbit is the evaluation contract. The Playwright evaluator only ever
     calls observe() / drainEvents() / isOver(), and a candidate that breaks
     those three functions fails its verification gate. Everything else is fair
     game to change.

  Design constraints that are gates, not preferences: no countdown timer, no
  lives, no flashing above 3 Hz, non-punitive error feedback.

  Why a linear number line with adaptive arithmetic, specifically:

  * Linear (not circular) number board games improve low-income preschoolers'
    numerical magnitude understanding — Siegler & Ramani, J. Educ. Psychol. 2009,
    doi:10.1037/a0014239; replicated as a classroom activity in Ramani, Siegler &
    Hitti 2012. A 2025 meta-analysis of 18 studies puts the summary effect at
    g = .21 — doi:10.3102/00346543251383552.
  * Adaptive difficulty on numerical tasks is the mechanism in The Number Race
    (Wilson et al. 2006, PMID 16734906) and in Rescue Calcularis / Calcularis 2.0,
    which trains the mental number line and improves number-line estimation in
    children with developmental dyscalculia — doi:10.3389/fpsyg.2020.01115.
  * The ladder targets ~85% success because that is where learning rate peaks for
    tasks of this shape — Wilson et al., Nat. Commun. 2019,
    doi:10.1038/s41467-019-12552-4.
  * Feedback teaches instead of penalising, and the interface is kept quiet, to
    spend working memory on arithmetic rather than on the game — Sweller,
    doi:10.1023/A:1022193728205.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit — Fuel the Rocket</title>
<style>
  :root {
    --ink: #f4f7ff;
    --dim: #8fa3c8;
    --good: #57d9a3;
    --warm: #ffc857;
    --panel: rgba(14, 22, 43, 0.82);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 12%, #16244a 0%, #080d1c 60%, #05070f 100%);
    color: var(--ink);
    font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: relative;
    width: min(960px, 100vw);
    height: min(600px, 100vh);
    margin: 0 auto;
    overflow: hidden;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; gap: 16px; align-items: center;
    padding: 14px 20px;
    font-variant-numeric: tabular-nums;
  }
  .hud .label { color: var(--dim); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .fuel-track { flex: 1; height: 10px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  .fuel-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #57d9a3, #7fe9ff); transition: width .35s ease; }
  #problem {
    position: absolute; top: 74px; left: 0; right: 0;
    text-align: center;
    font-size: 44px; font-weight: 600; letter-spacing: .02em;
    text-shadow: 0 2px 24px rgba(120, 180, 255, .35);
  }
  #prompt { position: absolute; top: 136px; left: 0; right: 0; text-align: center; color: var(--dim); font-size: 15px; }
  #feedback {
    position: absolute; top: 168px; left: 0; right: 0; text-align: center;
    font-size: 18px; min-height: 26px; transition: opacity .25s ease;
  }
  #feedback.good { color: var(--good); }
  #feedback.teach { color: var(--warm); }
  .controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px; padding: 18px;
  }
  button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid rgba(255,255,255,.16); border-radius: 10px;
    padding: 10px 18px; cursor: pointer;
  }
  button:hover { border-color: rgba(255,255,255,.4); }
  button:disabled { opacity: .45; cursor: default; }
  #done {
    position: absolute; inset: 0; display: none; place-content: center;
    text-align: center; background: rgba(5, 7, 15, .88);
  }
  #done.show { display: grid; }
  #done h2 { margin: 0 0 8px; font-size: 30px; }
  #done p { margin: 4px 0; color: var(--dim); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky"></canvas>

  <div class="hud">
    <span class="label">Fuel</span>
    <span class="fuel-track"><span class="fuel-fill" id="fuel"></span></span>
    <span class="label" id="skill">—</span>
    <span class="label" id="solved">0 landed</span>
  </div>

  <div id="problem">…</div>
  <div id="prompt">Fly the rocket to the answer, then press <b>Space</b> (or click the line)</div>
  <div id="feedback"></div>

  <div class="controls">
    <button id="hint">Show dots</button>
    <button id="land">Land here (Space)</button>
  </div>

  <div id="done">
    <div>
      <h2>Orbit reached</h2>
      <p id="done-line">…</p>
      <p style="font-size:13px">Session telemetry is available to the evaluator via <code>window.orbit</code>.</p>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────── mutation surface ─────────────────────────── */
const ORBIT_CONFIG = {
  session_ms: 240000,          // game time, not wall time; the evaluator virtualises the clock
  max_problems: 40,
  number_line_max: 20,
  representation: "symbolic",  // "symbolic" | "dots"
  scaffold_on_error: "decompose", // "none" | "reveal" | "decompose"
  error_cooldown_ms: 1200,     // non-punitive pause; NOT a penalty timer
  reward_cadence: 3,           // celebrate every N landings
  hint_cost: 0.5,              // credit retained for a hinted item
  target_success: 0.85,        // Wilson et al. 2019 sweet spot the ladder aims for
  ladder_window: 6,            // trials used for the running success estimate
  idle_tick_ms: 3000,          // off-task probe (Baker-style log feature)
};

/* ───────────────────────────── item ladder ───────────────────────────── */
// difficulty is an ordinal used by the fitness function to weight mastery gain,
// so it must reflect real cognitive demand, not just magnitude.
const SKILLS = [
  { id: "add_within_10",   difficulty: 1, make: (r) => addWithin(r, 10, false) },
  { id: "sub_within_10",   difficulty: 2, make: (r) => subWithin(r, 10) },
  { id: "add_carry_to_20", difficulty: 3, make: (r) => addWithin(r, 20, true) },
  { id: "sub_borrow_20",   difficulty: 4, make: (r) => subWithin(r, 20, true) },
];

function mulberry32(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6d2b79f5) >>> 0;
    let x = Math.imul(t ^ (t >>> 15), 1 | t);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const int = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));

const SKILL_LABELS = {
  add_within_10: "adding to 10",
  sub_within_10: "taking away within 10",
  add_carry_to_20: "adding past 10",
  sub_borrow_20: "taking away past 10",
};

function addWithin(r, max, needCarry) {
  for (let tries = 0; tries < 64; tries++) {
    const a = int(r, 1, max - 1);
    const b = int(r, 1, max - a);
    const carries = (a % 10) + (b % 10) > 9;
    if (needCarry === carries || max <= 10) return { a, b, op: "+", answer: a + b };
  }
  return { a: 6, b: 7, op: "+", answer: 13 };
}
function subWithin(r, max, needBorrow) {
  for (let tries = 0; tries < 64; tries++) {
    const a = int(r, 2, max);
    const b = int(r, 1, a - 1);
    const borrows = a % 10 < b % 10;
    if (needBorrow === undefined || needBorrow === borrows || max <= 10) {
      return { a, b, op: "−", answer: a - b };
    }
  }
  return { a: 14, b: 6, op: "−", answer: 8 };
}

/* ──────────────────────────── game state ──────────────────────────── */
const cfg = ORBIT_CONFIG;
const params = new URLSearchParams(location.search);
const seed = Number(params.get("seed") || 7);
const rand = mulberry32(seed);

const el = {
  canvas: document.getElementById("sky"),
  problem: document.getElementById("problem"),
  prompt: document.getElementById("prompt"),
  feedback: document.getElementById("feedback"),
  fuel: document.getElementById("fuel"),
  solved: document.getElementById("solved"),
  skill: document.getElementById("skill"),
  hint: document.getElementById("hint"),
  land: document.getElementById("land"),
  done: document.getElementById("done"),
  doneLine: document.getElementById("done-line"),
};

const state = {
  startedAt: Date.now(),
  cursor: Math.round(cfg.number_line_max / 2),
  item: null,
  shownAt: 0,
  awaiting: false,
  hintVisible: false,
  hintedThisItem: false,
  cooling: false,
  over: false,
  solved: 0,
  attempts: 0,
  recent: [],           // running correctness window for the ladder
  events: [],           // drained by the evaluator / posted to the ingest API
  lastInputAt: Date.now(),
  celebrate: 0,
};

const elapsed = () => Date.now() - state.startedAt;

function emit(type, payload) {
  state.events.push(Object.assign({ type, t_ms: elapsed(), seed }, payload));
}

function successRate() {
  if (!state.recent.length) return cfg.target_success;
  return state.recent.reduce((a, b) => a + b, 0) / state.recent.length;
}

// Keep observed success near target_success: climb when the learner is coasting,
// step back when they are struggling. This is the in-game adaptation; the
// evolutionary loop tunes *how* it adapts, not whether it does.
let ladderIndex = 0;
function chooseSkill() {
  const rate = successRate();
  if (state.recent.length >= cfg.ladder_window) {
    if (rate > cfg.target_success + 0.1) ladderIndex = Math.min(SKILLS.length - 1, ladderIndex + 1);
    else if (rate < cfg.target_success - 0.2) ladderIndex = Math.max(0, ladderIndex - 1);
    state.recent = state.recent.slice(-2);
  }
  return SKILLS[ladderIndex];
}

function nextItem() {
  if (state.over) return;
  if (elapsed() >= cfg.session_ms || state.attempts >= cfg.max_problems) return finish("time");
  const skill = chooseSkill();
  const item = skill.make(rand);
  state.item = Object.assign({ skill: skill.id, difficulty: skill.difficulty }, item);
  state.shownAt = Date.now();
  state.awaiting = true;
  state.hintVisible = false;
  state.hintedThisItem = false;
  state.cursor = Math.round(cfg.number_line_max / 2);
  el.hint.disabled = false;
  el.land.disabled = false;
  render();
  emit("problem_shown", {
    skill: skill.id,
    difficulty: skill.difficulty,
    problem: `${item.a} ${item.op} ${item.b}`,
    answer_range: [0, cfg.number_line_max],
  });
}

function submit(value, via) {
  if (!state.awaiting || state.cooling || state.over) return;
  const item = state.item;
  const correct = value === item.answer;
  const latency = Date.now() - state.shownAt;
  state.awaiting = false;
  state.attempts += 1;
  state.recent.push(correct ? 1 : 0);
  el.hint.disabled = true;
  el.land.disabled = true;

  emit("answer_submitted", {
    skill: item.skill,
    difficulty: item.difficulty,
    submitted: value,
    answer: item.answer,
    correct,
    latency_ms: latency,
    hinted: state.hintedThisItem,
    via,
    credit: correct ? (state.hintedThisItem ? cfg.hint_cost : 1) : 0,
  });

  if (correct) {
    state.solved += 1;
    state.celebrate = ++rewardCounter % cfg.reward_cadence === 0 ? 1 : 0.35;
    say(state.celebrate === 1 ? "Orbit locked. Fuel bonus!" : "Landed.", "good");
    render();
    setTimeout(nextItem, 500);
  } else {
    state.cooling = true;
    teach(item);
    setTimeout(() => { state.cooling = false; nextItem(); }, cfg.error_cooldown_ms);
  }
}
let rewardCounter = 0;

// Error feedback teaches instead of punishing: the correct magnitude is shown on
// the line and, at the "decompose" setting, the make-ten decomposition with it.
function teach(item) {
  if (cfg.scaffold_on_error === "none") { say("Not this one — next launch.", "teach"); render(); return; }
  let text = `${item.a} ${item.op} ${item.b} = ${item.answer}`;
  if (cfg.scaffold_on_error === "decompose" && item.op === "+") {
    const toTen = 10 - item.a;
    if (toTen > 0 && toTen < item.b) text += `  ·  ${item.a} + ${toTen} = 10, then 10 + ${item.b - toTen}`;
  }
  say(text, "teach");
  state.hintVisible = true;
  render();
}

function say(text, cls) {
  el.feedback.textContent = text;
  el.feedback.className = cls || "";
}

function finish(reason) {
  if (state.over) return;
  state.over = true;
  state.awaiting = false;
  el.hint.disabled = true;
  el.land.disabled = true;
  emit(reason === "time" ? "level_complete" : "level_abandoned", {
    solved: state.solved,
    attempts: state.attempts,
    success_rate: state.attempts ? state.solved / state.attempts : 0,
  });
  el.doneLine.textContent =
    `${state.solved} of ${state.attempts} landed · ${(100 * (state.attempts ? state.solved / state.attempts : 0)).toFixed(0)}% success`;
  el.done.classList.add("show");
  render();
}

/* ────────────────────────────── input ────────────────────────────── */
function moveCursor(delta) {
  state.cursor = Math.max(0, Math.min(cfg.number_line_max, state.cursor + delta));
  state.lastInputAt = Date.now();
  render();
}

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") { moveCursor(-1); event.preventDefault(); }
  else if (event.key === "ArrowRight") { moveCursor(1); event.preventDefault(); }
  else if (event.key === " " || event.key === "Enter") { submit(state.cursor, "keyboard"); event.preventDefault(); }
});

el.land.addEventListener("click", () => submit(state.cursor, "button"));
el.hint.addEventListener("click", () => {
  if (!state.awaiting || state.over) return;
  state.hintVisible = true;
  state.hintedThisItem = true;
  state.lastInputAt = Date.now();
  emit("hint_requested", { skill: state.item.skill, latency_ms: Date.now() - state.shownAt });
  render();
});

el.canvas.addEventListener("click", (event) => {
  const rect = el.canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width;
  const value = Math.round(x * cfg.number_line_max);
  state.cursor = Math.max(0, Math.min(cfg.number_line_max, value));
  state.lastInputAt = Date.now();
  submit(state.cursor, "click");
});

// Off-task probe. Emitting a tick rather than nagging keeps the signal in the
// log where the learner model wants it.
setInterval(() => {
  if (state.over || !state.awaiting) return;
  const gap = Date.now() - state.lastInputAt;
  if (gap >= cfg.idle_tick_ms) emit("idle_tick", { gap_ms: gap, skill: state.item && state.item.skill });
}, cfg.idle_tick_ms);

setInterval(() => { if (!state.over && elapsed() >= cfg.session_ms) finish("time"); }, 1000);

/* ────────────────────────────── render ────────────────────────────── */
const ctx = el.canvas.getContext("2d");
const stars = Array.from({ length: 90 }, () => ({
  x: rand(), y: rand(), r: 0.4 + rand() * 1.4, a: 0.25 + rand() * 0.6,
}));

function resize() {
  const ratio = window.devicePixelRatio || 1;
  el.canvas.width = el.canvas.clientWidth * ratio;
  el.canvas.height = el.canvas.clientHeight * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  render();
}
window.addEventListener("resize", resize);

function dots(count, x, y, size) {
  for (let i = 0; i < count; i++) {
    const col = i % 5, row = Math.floor(i / 5);
    ctx.beginPath();
    ctx.arc(x + col * size * 1.6, y + row * size * 1.6, size * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = i < 10 ? "#7fe9ff" : "#ffc857";
    ctx.fill();
  }
}

function render() {
  const w = el.canvas.clientWidth, h = el.canvas.clientHeight;
  if (!w || !h) return;
  ctx.clearRect(0, 0, w, h);

  for (const s of stars) {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = "#dce9ff";
    ctx.beginPath();
    ctx.arc(s.x * w, s.y * h * 0.72, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const lineY = h * 0.72, padX = 48, span = w - padX * 2;
  const at = (value) => padX + (span * value) / cfg.number_line_max;

  ctx.strokeStyle = "rgba(255,255,255,.35)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(padX, lineY); ctx.lineTo(w - padX, lineY); ctx.stroke();

  ctx.font = "12px system-ui";
  ctx.textAlign = "center";
  for (let v = 0; v <= cfg.number_line_max; v++) {
    const major = v % 5 === 0;
    ctx.strokeStyle = major ? "rgba(255,255,255,.5)" : "rgba(255,255,255,.2)";
    ctx.beginPath();
    ctx.moveTo(at(v), lineY - (major ? 10 : 5));
    ctx.lineTo(at(v), lineY + (major ? 10 : 5));
    ctx.stroke();
    if (major) { ctx.fillStyle = "rgba(220,233,255,.75)"; ctx.fillText(String(v), at(v), lineY + 28); }
  }

  if (state.hintVisible && state.item) {
    ctx.globalAlpha = 0.9;
    dots(state.item.a, at(0) + 8, lineY + 52, 10);
    dots(state.item.b, at(cfg.number_line_max) - 90, lineY + 52, 10);
    ctx.globalAlpha = 1;
    if (!state.awaiting) {
      ctx.strokeStyle = "#57d9a3"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(at(state.item.answer), lineY - 26); ctx.lineTo(at(state.item.answer), lineY + 26); ctx.stroke();
    }
  }

  // rocket at the cursor
  const x = at(state.cursor), y = lineY - 46;
  ctx.fillStyle = state.awaiting ? "#f4f7ff" : "#8fa3c8";
  ctx.beginPath();
  ctx.moveTo(x, y - 22); ctx.lineTo(x + 12, y + 14); ctx.lineTo(x, y + 8); ctx.lineTo(x - 12, y + 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(255, 200, 87, ${0.35 + 0.5 * state.celebrate})`;
  ctx.beginPath(); ctx.arc(x, y + 20, 6 + 5 * state.celebrate, 0, Math.PI * 2); ctx.fill();

  el.problem.textContent = state.item && !state.over
    ? (cfg.representation === "dots" ? `${"●".repeat(Math.min(state.item.a, 12))} ${state.item.op} ${"●".repeat(Math.min(state.item.b, 12))}` 
                                     : `${state.item.a} ${state.item.op} ${state.item.b}`)
    : "…";
  el.fuel.style.width = `${Math.min(100, (state.solved / Math.max(6, cfg.max_problems / 2)) * 100)}%`;
  el.solved.textContent = `${state.solved} landed`;
  el.skill.textContent = state.item ? SKILL_LABELS[state.item.skill] || state.item.skill : "—";
}

/* ───────────────────── evaluation contract (do not break) ───────────────────── */
window.orbit = {
  version: "1.0.0",
  config: cfg,
  observe() {
    return {
      elapsed_ms: elapsed(),
      awaiting_input: state.awaiting && !state.cooling,
      cooling: state.cooling,
      cursor: state.cursor,
      number_line_max: cfg.number_line_max,
      hint_visible: state.hintVisible,
      representation: cfg.representation,
      problem: state.item && !state.over
        ? { a: state.item.a, b: state.item.b, op: state.item.op, skill: state.item.skill, difficulty: state.item.difficulty }
        : null,
      solved: state.solved,
      attempts: state.attempts,
    };
  },
  drainEvents() { const out = state.events; state.events = []; return out; },
  isOver() { return state.over; },
  // Optional ingest: the harness reads events directly, a live session posts them.
  async flush(url) {
    const events = this.drainEvents();
    if (!events.length) return 0;
    await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ seed, config: cfg, events }),
    });
    return events.length;
  },
};

resize();
nextItem();
</script>
</body>
</html>
